name = "eptw-sheets-sync"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# SPREADSHEET_ID can be set here or in Cloudflare Dashboard Secrets
# SPREADSHEET_ID = "YOUR_SPREADSHEET_ID"
SHEET_NAME = "WorkPermits"
ALLOWED_ORIGIN = "*"

# SECRETS (Do NOT commit real keys here, set in Cloudflare Dashboard > Settings > Variables):
# - JSON_KEY (or CLIENT_EMAIL and PRIVATE_KEY)
# - SPREADSHEET_ID
# - API_SECRET_KEY (optional)
